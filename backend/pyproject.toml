[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthpilot"
version = "0.1.0"
description = "GrowthPilot AI — autonomous AI marketing platform with human-approved publishing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
  "anthropic>=2.3",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
growthpilot = "growthpilot.cli:main"

[tool.setuptools.packages.find]
include = ["growthpilot*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
