# CI: the same commands verified locally with `make test` and `make build`.
# Not yet run on GitHub Actions (the repository hasn't been pushed).
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - run: ruff check growthpilot tests migrations
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m pip install pip-audit && pip-audit --progress-spinner off || true
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high || true
